; ====================================================================
; PlatformIO Project Configuration File
; Project: Verona Project - LoRa GPS Communication
; ====================================================================

[platformio]
default_envs = romeo
description = Verona Project: LoRa GPS Ping-Pong Communication (Romeo <-> Juliet)

; ---- Shared settings for all environments ----------------------------
[env]
framework = arduino
monitor_speed = 9600
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    mikalhart/TinyGPSPlus @ ^1.0.3

; ====================================================================
; ROMEO - Transmitter / Remote Node
;   ESP32 + Ra-02 (SX1278, 433 MHz) + u-blox GPS (NEO-6M / NEO-7M)
;   LoRa:  SS=5  RST=14  DIO0=26  SCK=18  MISO=19  MOSI=23
;   GPS:   RX=GPIO32   TX=GPIO33   BAUD=9600
; ====================================================================
[env:romeo]
platform = espressif32
board = esp32dev
build_src_filter = +<romeo.cpp>
build_flags =
    -D BOARD_ROMEO

; ====================================================================
; I2C Scanner - flash this to find LCD I2C address
; ====================================================================
[env:i2c_scan]
platform = espressif32
board = esp32dev
build_src_filter = +<i2c_scan.cpp>

; ====================================================================
; JULIET - Receiver / Base Station Node
;   Same ESP32 + Ra-02 wiring, no GPS required.
; ====================================================================
[env:juliet]
platform = espressif32
board = esp32dev
build_src_filter = +<juliet.cpp>
build_flags =
    -D BOARD_JULIET
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; ====================================================================
; Generic ESP32 environment with the original Verona main.cpp
; ====================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
build_src_filter = +<main.cpp>
build_flags =
    -D BOARD_ESP32_GENERIC
    -D MONITOR_BAUD=115200

; ====================================================================
; TTGO LoRa32 with built-in LoRa
; ====================================================================
[env:ttgo_lora32]
platform = espressif32
board = ttgo-lora32-v1
build_src_filter = +<main.cpp>
build_flags =
    -D BOARD_TTGO_LORA32
    -D MONITOR_BAUD=115200

; ====================================================================
; Arduino Nano / Uno with SX1278
; ====================================================================
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
monitor_speed = 9600
build_src_filter = +<main.cpp>
build_flags =
    -D BOARD_ARDUINO_NANO
    -D MONITOR_BAUD=9600
